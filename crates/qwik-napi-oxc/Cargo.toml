[package]
name = "qwik-napi-oxc"
version = "0.1.0"
edition = "2024"
description = "NAPI binding for the Qwik OXC optimizer"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
qwik-optimizer-oxc = { path = "../qwik-optimizer-oxc", default-features = false, features = ["parallel"] }
napi = { version = "2", features = ["serde-json", "async"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
